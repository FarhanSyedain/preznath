[project]
name = "preznath-api"
version = "0.1.0"
description = "Preznath — multi-stage ML pipeline that screens UPI / payment messages for fraud. Team Yimberzol."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "torch>=2.2",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "protobuf>=4.25",
    "numpy>=1.26",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satark"]
